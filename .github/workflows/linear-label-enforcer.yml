name: Enforce Linear Label

on:
  issues:
    types: [opened, edited, labeled, unlabeled]

jobs:
  enforce:
    runs-on: ubuntu-latest

    steps:
      - name: Close Linear issue if label is missing
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_LABELS: ${{ toJson(github.event.issue.labels) }}
        run: |
          echo "Checking labels..."

          if echo "$ISSUE_LABELS" | grep -q '"linear"'; then
            echo "Label found. Nothing to do."
            exit 0
          fi

          echo "Label NOT found. Closing Linear issue."

          RESPONSE=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d '{
              "query": "query($url: String!) { issues(filter: { attachments: { url: { eq: $url } } }) { nodes { id } } }",
              "variables": { "url": "'"$ISSUE_URL"'" }
            }')

          ISSUE_ID=$(echo "$RESPONSE" | jq -r '.data.issues.nodes[0].id')

          if [ "$ISSUE_ID" = "null" ] || [ -z "$ISSUE_ID" ]; then
            echo "No Linear issue found."
            exit 0
          fi

          curl -s -X POST https://api.linear.app/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d '{
              "query": "mutation($id: String!, $stateId: String!) { issueUpdate(input: { id: $id, stateId: $stateId }) { success } }",
              "variables": {
                "id": "'"$ISSUE_ID"'",
                "stateId": "YOUR_LINEAR_STATE_ID"
              }
            }'

          echo "Linear issue closed."
